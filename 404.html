<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada · Radio Web Neo</title>
<meta name="robots" content="noindex">

<!-- Esta página se sirve en cualquier ruta que no existe, a cualquier profundidad (/a, /a/b/c…):
     por eso no carga ningún archivo externo, todo va aquí dentro. Sin ella, Cloudflare Pages
     daría la aplicación (con un 200) en cualquier dirección inventada -->
<style>
  @property --accent { syntax: '<color>'; inherits: true; initial-value: #58dfa3; }
  :root { color-scheme: dark; --accent: #58dfa3; --on-accent: color-mix(in srgb, var(--accent) 9%, #000); }
  html { background: #1a2029; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh; box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px 20px; text-align: center;
    font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    background: #1a2029; color: #edf2f7;
  }
  .codigo { margin: 0; font-size: 5rem; font-weight: 700; line-height: 1; color: var(--accent); }
  h1 { margin: 12px 0 0; font-size: 1.35rem; }
  p { margin: 12px 0 28px; color: #a0aec0; }
  a {
    display: inline-block; padding: 11px 22px; border-radius: 10px;
    background: var(--accent); color: var(--on-accent);
    font-weight: 650; text-decoration: none;
  }
  a:hover, a:focus-visible { filter: brightness(1.08); }
</style>

<script>
// El mismo color de énfasis que la aplicación, si hay ajustes guardados
try {
  var c = JSON.parse(localStorage.getItem('rn_cfg') || '{}');
  if (/^#[0-9a-f]{6}$/i.test(c.accent)) document.documentElement.style.setProperty('--accent', c.accent);
} catch (e) {}
</script>
</head>
<body>
  <p class="codigo" aria-hidden="true">404</p>
  <h1>Página no encontrada</h1>
  <p>La dirección no existe o ha cambiado de sitio</p>
  <a href="/">Ir a Radio Web Neo</a>
</body>
</html>
